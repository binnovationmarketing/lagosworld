<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8c96a"/>
      <stop offset="40%"  stop-color="#c9a84c"/>
      <stop offset="75%"  stop-color="#b8922e"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
    <linearGradient id="goldbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a1610"/>
      <stop offset="100%" stop-color="#0d0d0b"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" rx="14" fill="url(#goldbg)"/>

  <!-- Outer gold circle -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#gold)" stroke-width="2.2" opacity="0.9"/>
  <!-- Inner subtle circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.35"/>

  <!-- L — left serif italic -->
  <text
    x="24" y="63"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="46"
    fill="url(#gold)"
    opacity="1"
    letter-spacing="-4"
  >L</text>

  <!-- W — right, slightly overlapping -->
  <text
    x="46" y="63"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="38"
    fill="url(#gold)"
    opacity="0.95"
  >W</text>
</svg>
