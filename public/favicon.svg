<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f0d060"/>
      <stop offset="50%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a87830"/>
    </linearGradient>
  </defs>

  <!-- Dark background with slight rounding -->
  <rect width="100" height="100" rx="16" fill="#0d0d0b"/>

  <!-- Bold LW centered -->
  <text
    x="50" y="70"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="900"
    font-size="58"
    fill="url(#g)"
    letter-spacing="-3"
  >LW</text>
